<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A playful classroom name wheel spinner for picking students fairly."
    />
    <title>Classroom Name Wheel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <button
      id="openAdminButton"
      class="admin-toggle"
      type="button"
      aria-controls="teacherDrawer"
      aria-expanded="false"
    >
      Roster
    </button>

    <main class="app-shell">
      <section class="spinner-stage" aria-labelledby="app-title">
        <div class="title-group">
          <p class="eyebrow">The Name Picker</p>
          <h1 id="app-title">Fri-Yay!</h1>
        </div>

        <div class="wheel-wrap">
          <div class="pointer" aria-hidden="true"></div>
          <canvas id="wheel" width="720" height="720" aria-label="Name wheel"></canvas>
          <div class="wheel-center" aria-hidden="true">
            <span>Spin!</span>
          </div>
        </div>

        <div class="spin-controls">
          <button id="spinButton" class="primary-button" type="button">
            <span aria-hidden="true">✦</span>
            Spin the Wheel
          </button>
        </div>
      </section>
    </main>

    <div id="drawerOverlay" class="drawer-overlay" aria-hidden="true"></div>

    <aside
      id="teacherDrawer"
      class="names-panel"
      aria-labelledby="names-title"
      aria-hidden="true"
    >
        <div class="panel-header">
          <div>
            <p class="eyebrow">Roster</p>
            <h2 id="names-title">Names on the Wheel</h2>
          </div>
          <div class="panel-actions">
            <span id="activeCount" class="count-pill">0 active</span>
            <button
              id="closeAdminButton"
              class="drawer-close"
              type="button"
              aria-label="Close roster drawer"
            >
              ×
            </button>
          </div>
        </div>

        <form id="addNamesForm" class="add-form">
          <label for="namesInput">Add names</label>
          <textarea
            id="namesInput"
            name="names"
            rows="5"
            placeholder="One name, one name per line, or names separated by commas"
          ></textarea>
          <button id="addNamesButton" class="secondary-button" type="submit">Add Names</button>
        </form>

        <div class="quick-actions" aria-label="Roster actions">
          <button id="allOnButton" class="mini-button" type="button">All On</button>
          <button id="allOffButton" class="mini-button" type="button">All Off</button>
          <button id="clearButton" class="mini-button danger" type="button">Clear</button>
        </div>

        <ul id="nameList" class="name-list" aria-label="Student names"></ul>
      </aside>

    <div id="winnerModal" class="winner-modal" aria-hidden="true">
      <div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>
      <section
        class="winner-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="winnerModalTitle"
      >
        <p class="eyebrow">The wheel picked</p>
        <h2 id="winnerModalTitle">Winner!</h2>
        <button id="closeWinnerModal" class="primary-button modal-button" type="button">
          Yay!
        </button>
      </section>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
